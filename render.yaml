services:
  # 1. Backend Flask Web Service
  - type: web
    name: award-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 4 --threads 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: award-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: static
          name: award-frontend
          property: url
      - key: CORS_ORIGINS
        fromService:
          type: static
          name: award-frontend
          property: url

  # 2. Frontend React Vite Static Site
  - type: static
    name: award-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: award-backend
          property: url
          append: /api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. PostgreSQL Database
  - name: award-db
    databaseName: award
    user: postgres
    plan: free
